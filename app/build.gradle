plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Optional local override for the dashboard base URL. No secrets live here:
// login happens in the WebView and native calls reuse its scoped cookies.
def props = new Properties()
def lp = rootProject.file('local.properties')
if (lp.exists()) lp.withInputStream { props.load(it) }

android {
    namespace 'org.crolab.chromescribe'
    compileSdk 34

    defaultConfig {
        applicationId 'org.crolab.chromescribe'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2.0'
        buildConfigField 'String', 'WEB_BASE',
            "\"${props.getProperty('cs.base', 'https://chromescribe-dashboard.ancient-glitter-9ac9.workers.dev')}\""
    }

    buildFeatures { buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Unsigned unless a local signingConfig is supplied by the parent.
        }
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // Real org.json for pure-JVM parsing tests (android.jar only has stubs).
    testImplementation 'org.json:json:20231013'
}