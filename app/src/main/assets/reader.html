<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5">
<meta name="color-scheme" content="dark light">
<title>ChromeScribe</title>
<style>
  :root { color-scheme: dark light; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; padding: 16px 18px 48px;
    font: 17px/1.65 "Geist", -apple-system, "Segoe UI", Roboto, system-ui, sans-serif;
    background: #0a0a0a; color: #ededed;
  }
  h1 { font-size: 24px; margin: 8px 0 14px; color: #fff; line-height: 1.25; }
  h2 { font-size: 21px; margin: 28px 0 10px; color: #fff; }
  h3 { font-size: 18px; margin: 22px 0 8px; color: #d4d4d4; }
  h4, h5, h6 { font-size: 17px; margin: 18px 0 8px; color: #d4d4d4; }
  p { margin: 0 0 14px; }
  a { color: #7aa2ff; overflow-wrap: anywhere; }
  code { background: #1c1c1c; padding: 2px 5px; border-radius: 4px; font-size: 15px; }
  blockquote { border-left: 3px solid #333; margin: 14px 0; padding: 2px 0 2px 14px; color: #a0a0a0; }
  hr { border: 0; border-top: 1px solid #262626; margin: 26px 0; }
  ul, ol { padding-left: 22px; margin: 0 0 14px; }
  li { margin-bottom: 7px; }
  details { margin-top: 20px; border-top: 1px solid #262626; padding-top: 14px; }
  summary { cursor: pointer; color: #a0a0a0; padding: 8px 0; }
  img { max-width: 100%; height: auto; }

  /* Light overrides must come AFTER the dark rules above, or h1/h2 stay white. */
  @media (prefers-color-scheme: light) {
    body { background: #ffffff; color: #111111; }
    h1, h2, h3, h4, h5, h6 { color: #000; }
    a { color: #1a56db; }
    code { background: #f2f2f2; }
    blockquote { border-color: #ddd; color: #555; }
    hr, details { border-color: #e5e5e5; }
    summary { color: #555; }
  }
</style>
</head>
<body>
<div id="content">__CONTENT__</div>
</body>
</html>
